name: mobile
description: SoundConnect mobilna aplikacija za klijente.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  go_router: 18.0.2
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#2A1460"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
