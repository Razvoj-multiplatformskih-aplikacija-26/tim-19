name: server
description: SoundConnect HTTP server na Relic-u i PostgreSQL-u; pre upisa proverava ista pravila iz domena kao klijenti.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  api_contract:
    path: ../../packages/api_contract
  api_mapping:
    path: ../../packages/api_mapping
  domain:
    path: ../../packages/domain
  hashlib: 2.4.2
  pool: 1.5.3
  postgres: 3.5.18
  relic: 1.2.0

dev_dependencies:
  http: 1.6.0
  test: 1.31.1
